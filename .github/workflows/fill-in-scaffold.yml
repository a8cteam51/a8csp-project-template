name: Fill in the Scaffold Placeholders

on:
  repository_dispatch:
    types: [ fill_scaffold ]
  workflow_dispatch:
    inputs:
      strip-teaching-content:
        description: 'Rewrite the teaching narration into contract-level documentation'
        type: boolean
        default: false

# One fill at a time; a duplicate dispatch then fills from the pre-fill commit, and its publish job refuses to push.
concurrency:
  group: fill-scaffold-${{ github.repository_id }}
  cancel-in-progress: false

# The fill-in runs dependency code (the npm re-format and build), so it holds only a read token and
# hands its commits over as a bundle; the job that holds the write token runs no repository code.
jobs:
  generate:
    name: Fill in the placeholders
    # The template's immutable repository ID survives renames and transfers; every generated repository has its own.
    if: github.repository_id != '1297742940'

    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.sha }}

    steps:
      # A run queued against a non-default ref must never fill in and push scaffolding commits there.
      - name: Require the workflow ref to be the default branch
        env:
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::workflow ref '$REF_NAME' is not the repository default branch '$DEFAULT_BRANCH'; re-run this workflow from the default branch"
            exit 1
          fi

      # Scaffold values become PHP identifiers, docblock text, package names, and component paths.
      # Validate every input before checkout so an invalid repository remains pristine.
      - name: Validate the scaffold identity inputs
        env:
          REPO_JSON: ${{ toJSON( github.event.repository ) }}
        run: |
          read_json_value() {
            local destination="$1"
            local filter="$2"
            local value

            IFS= read -r -d '' value < <(
              printf '%s' "$REPO_JSON" | jq -r "$filter"
              printf '\0'
            )
            value=${value%$'\n'}
            printf -v "$destination" '%s' "$value"
          }

          report_error() {
            local field="$1"
            local value="$2"
            local requirement="$3"
            local displayed_value

            printf -v displayed_value '%q' "$value"
            printf '::error::%s has offending value %s; %s\n' "$field" "$displayed_value" "$requirement"
            invalid=1
          }

          read_json_value human_title '.custom_properties["human-title"] // empty'
          read_json_value php_globals_short_prefix '.custom_properties["php-globals-short-prefix"] // empty'
          read_json_value repository_name '.name'

          invalid=0

          # The title lands in a PHP string literal (the features floor-gate notice) and, space-stripped,
          # in the `@package` identifier; an apostrophe in it is a parse error, and this workflow's pushes
          # trigger no CI to catch one.
          title_grammar='^[A-Za-z0-9][A-Za-z0-9 ]*$'
          if [ -z "$human_title" ]; then
            report_error "repository custom property 'human-title'" "$human_title" 'it must be present and non-empty'
          elif [[ ! "$human_title" =~ $title_grammar ]]; then
            report_error "repository custom property 'human-title'" "$human_title" 'it must contain only letters, digits, and spaces (it lands in PHP string literals)'
          fi

          # The prefix replaces `a8csp_template` in every minted global identifier; degenerate
          # values (`a`, `site_`) would ship collision-prone or double-underscore names fleet-wide.
          # The 15-character cap keeps `<prefix>_book`-style post type keys inside WordPress's
          # 20-character limit.
          prefix_grammar='^[a-z][a-z0-9_]{2,13}[a-z0-9]$'
          if [ -z "$php_globals_short_prefix" ]; then
            report_error "repository custom property 'php-globals-short-prefix'" "$php_globals_short_prefix" 'it must be present and non-empty'
          elif [[ ! "$php_globals_short_prefix" =~ $prefix_grammar ]] || [[ "$php_globals_short_prefix" == *__* ]]; then
            report_error "repository custom property 'php-globals-short-prefix'" "$php_globals_short_prefix" 'it must be 4-15 characters of lowercase snake_case, starting with a letter, ending with a letter or digit, with no __ runs'
          fi

          # The name becomes the theme slug, which starts the End-to-End locators' CSS ids and the
          # editor plugin name; neither may begin with a digit.
          if [[ ! "$repository_name" =~ ^[a-z][a-z0-9]*(-[a-z0-9]+)*$ ]]; then
            report_error 'repository name' "$repository_name" 'it must start with a letter and match ^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
          fi

          if [ "$invalid" -ne 0 ]; then
            exit 1
          fi

      # The checkout leaves no git credential behind: the re-format and build steps execute dependency code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record the commit the fill-in starts from
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup proper Node.js version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'

      - name: Set github actions[bot] as the committer
        run: git config --local user.name 'github-actions[bot]' && git config --local user.email 'github-actions[bot]@users.noreply.github.com'

      # The manifest's spans quote the pristine template, so the strip runs before the rename and
      # substitution.
      - name: Strip the teaching content when the dispatch asks for it
        env:
          STRIP_INPUT: ${{ inputs.strip-teaching-content }}
          STRIP_PAYLOAD: ${{ github.event.client_payload.strip-teaching-content }}
        run: |
          if [ "$STRIP_INPUT" = 'true' ] || [ "$STRIP_PAYLOAD" = 'true' ]; then
            node ./.github/workflows/fill-in-scaffold-content.mjs
            git commit -am "chore -- strip the teaching content"
          else
            echo "::notice::the dispatch did not ask for strip-teaching-content; keeping the template teaching prose"
          fi

      - name: Rename the readme, theme, and features mu-plugin
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          git mv --force README.scaffold.md README.md
          git mv themes/a8csp-project-template "themes/$REPO_NAME"
          git mv mu-plugins/a8csp-project-template-features/a8csp-project-template-features.php "mu-plugins/a8csp-project-template-features/$REPO_NAME-features.php"
          git mv mu-plugins/a8csp-project-template-features "mu-plugins/$REPO_NAME-features"

      - name: Commit the changed files
        run: git commit -am "chore -- rename files from scaffolding"

      - name: Perform string replacements within the files
        env:
          REPO_JSON: ${{ toJSON( github.event.repository ) }}
        run: node ./.github/workflows/fill-in-scaffold.mjs "$REPO_JSON"

      # The substitution above rewrote .gitignore's component negations to the new directory names;
      # only now can a new file inside the renamed features plugin be added without force.
      - name: Disable the features plugin's worked example
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          touch "mu-plugins/$REPO_NAME-features/.disabled"
          git add "mu-plugins/$REPO_NAME-features/.disabled"

      # A new repository starts on current dependencies, not on the template's possibly old lock,
      # holding npm to releases at least seven days old. --ignore-scripts skips install scripts; the
      # re-format and build steps below still run dependency code.
      - name: Resolve npm dependencies afresh
        run: |
          set -euo pipefail
          rm -f package-lock.json
          npm install --ignore-scripts --min-release-age=7 2>&1 | tee "$RUNNER_TEMP/npm-install.log"
          # An npm without the option only warns and then resolves without the release-age window.
          if grep -qF 'Unknown cli config "--min-release-age"' "$RUNNER_TEMP/npm-install.log"; then
            echo "::error::this npm does not support --min-release-age, so the resolve ignored the release-age window"
            exit 1
          fi

      # Substitution changes identifier lengths inside Prettier-formatted JavaScript, so lines wrap
      # differently; re-formatting here keeps the generated repository's first lint run green.
      - name: Re-format the substituted JavaScript
        run: npm run lint:scripts -- --fix

      # Substitution rewrote asset sources (slugs, text domains), so the committed build output is
      # rebuilt to match what this tree itself produces — the build-integrity gate diffs exactly that.
      - name: Rebuild the committed assets from the substituted sources
        run: npm run build

      - name: Setup PHP for the Composer resolve and the syntax sweep
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      # A new repository starts on current Composer dependencies too; the lock is resolved, not installed.
      - name: Resolve Composer dependencies afresh
        run: composer update --no-install --prefer-stable --ignore-platform-req=php+ --no-interaction

      # Substituted identifiers land inside PHP source, and pushes from this workflow trigger no
      # CI — a parse error here would ship a dead-on-arrival repository, so every PHP file is
      # syntax-checked before anything is committed.
      - name: Syntax-check every generated PHP file
        run: |
          set -euo pipefail
          find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Commit the filled-in placeholders
        run: git commit -am "chore -- fill in scaffolding placeholders"

      - name: Remove the spent fill-in-scaffold workflow
        run: |
          rm .github/workflows/fill-in-scaffold.yml .github/workflows/fill-in-scaffold.mjs .github/workflows/fill-in-scaffold-content.mjs .github/workflows/template-guard.yml
          git add .github/workflows
          git commit -m "chore -- remove the spent fill-in-scaffold workflow"

      - name: Bundle the fill-in commits
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git bundle create "$RUNNER_TEMP/fill-in.bundle" "$BASE..HEAD"
          git bundle verify "$RUNNER_TEMP/fill-in.bundle"

      - name: Upload the fill-in bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fill-in-bundle
          path: ${{ runner.temp }}/fill-in.bundle
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish the filled-in commits
    needs: generate
    # The template's immutable repository ID survives renames and transfers; every generated repository has its own.
    if: github.repository_id != '1297742940'

    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require the default branch to still be at the fill-in's starting commit
        env:
          BASE: ${{ needs.generate.outputs.base }}
        run: |
          if [ "$(git rev-parse HEAD)" != "$BASE" ]; then
            echo "::error::the default branch moved away from $BASE during the fill-in, so nothing was pushed"
            exit 1
          fi

      - name: Download the fill-in bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fill-in-bundle
          path: ${{ runner.temp }}/fill-in

      - name: Fetch the fill-in commits from the bundle
        run: |
          set -euo pipefail
          git bundle verify "$RUNNER_TEMP/fill-in/fill-in.bundle"
          git fetch "$RUNNER_TEMP/fill-in/fill-in.bundle" HEAD
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::the fill-in bundle does not fast-forward the default branch"
            exit 1
          fi

      # No hook may run while the token is in the environment.
      - name: Publish all the changed commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git -c core.hooksPath=/dev/null push "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPOSITORY}.git" "FETCH_HEAD:refs/heads/${DEFAULT_BRANCH}"
