name: Quality

on:
  pull_request:
  push:
    branches: [trunk, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-lint.yml@trunk
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  lint-scripts-styles:
    name: JS + CSS Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-scripts-styles-lint.yml@trunk

  php-syntax:
    name: PHP Syntax
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-syntax-check.yml@trunk
    with:
      php-versions: '["8.5", "8.6"]'

  belowfloor-syntax:
    name: Below-floor syntax (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none

      # Only the header-discovered features entry, the functions.php it requires ahead of its floor gate, and the static, headerless MU loader must parse below the site's PHP floor.
      # Header discovery survives generation renaming the features directory and entry file without rewriting .github/.
      - name: Check the below-floor files for syntax errors
        run: |
          set -euo pipefail

          mapfile -t entry_files < <(grep -l 'Plugin Name:' "$GITHUB_WORKSPACE"/mu-plugins/*/*.php || true)
          entry_count=${#entry_files[@]}
          if [ "$entry_count" -ne 1 ]; then
            echo "::error::expected exactly one mu-plugins/*/*.php file with a 'Plugin Name:' header, found $entry_count" >&2
            exit 1
          fi
          php -l "${entry_files[0]}"
          php -l "$(dirname "${entry_files[0]}")/functions.php"
          php -l "$GITHUB_WORKSPACE/mu-plugins/mu-loader.php"

  build-integrity:
    name: Build integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify the committed deploy artifact is byte-stable
        run: |
          set -euo pipefail

          build_status=$(git status --porcelain)
          if [ -n "$build_status" ]; then
            printf '%s\n' "$build_status"
            echo "::error::the committed tree IS the deploy artifact; a byte-stable rebuild must reproduce it exactly." >&2
            exit 1
          fi

  blocks-policy:
    name: Blocks policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks belong in the A8C Special Projects blocks monorepo, where every site can reuse them. A block
      # that has to live in this site repository is listed in .github/blocks-allowlist rather than marked
      # inside its block.json, which the block.json schema would reject.
      - name: Reject blocks not listed as staying in this repository
        env:
          ALLOWLIST: .github/blocks-allowlist
        run: |
          set -euo pipefail

          # One block.json path per line; `#` starts a comment. A missing file allows nothing.
          allowed=''
          if [ -f "$ALLOWLIST" ]; then
            allowed=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$ALLOWLIST")
          fi

          # Listed into a file rather than a process substitution, so a git failure fails the step.
          git ls-files -z -- 'block.json' '*/block.json' > "$RUNNER_TEMP/block-json-files"

          unlisted=0
          while IFS= read -r -d '' file; do
            if ! grep -qxF -- "$file" <<< "$allowed"; then
              echo "::error file=$file::$file keeps a block in this site repository. Blocks belong in the A8C Special Projects blocks monorepo (https://github.com/a8cteam51/special-projects-blocks-monorepo); to keep this one here, list its path in $ALLOWLIST."
              unlisted=$(( unlisted + 1 ))
            fi
          done < "$RUNNER_TEMP/block-json-files"

          if [ "$unlisted" -gt 0 ]; then
            exit 1
          fi
