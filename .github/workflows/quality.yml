name: Quality

on:
  pull_request:
  push:
    branches: [trunk, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-lint.yml@231be2507946169eeb18080c04a597be4e3fac7c # v1.2.0
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  lint-scripts-styles:
    name: JS + CSS Lint
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-scripts-styles-lint.yml@231be2507946169eeb18080c04a597be4e3fac7c # v1.2.0

  php-syntax:
    name: PHP Syntax
    uses: a8cteam51/a8csp-configs/.github/workflows/reusable-php-syntax-check.yml@231be2507946169eeb18080c04a597be4e3fac7c # v1.2.0

  # One job, not a matrix: GitHub bills every job by the minute, rounded up, and each version's
  # check takes seconds. Each setup-php step switches the job's PHP to the next version.
  belowfloor-syntax:
    name: Below-floor syntax
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every header-discovered directory mu-plugin entry and the headerless MU loader must parse
      # below the site's PHP floor; header discovery survives generation renaming the features
      # directory and entry file without rewriting .github/workflows/.
      - name: Write the below-floor check
        run: |
          cat > "$RUNNER_TEMP/below-floor-check.sh" <<'SH'
          set -euo pipefail

          mapfile -t entry_files < <(grep -l 'Plugin Name:' "$GITHUB_WORKSPACE"/mu-plugins/*/*.php || true)
          if [ "${#entry_files[@]}" -eq 0 ]; then
            echo "::error::expected at least one mu-plugins/*/*.php file with a 'Plugin Name:' header" >&2
            exit 1
          fi
          for entry_file in "${entry_files[@]}"; do
            php -l "$entry_file"
          done
          php -l "$GITHUB_WORKSPACE/mu-plugins/mu-loader.php"
          SH

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '7.4'
          coverage: none
          tools: none

      - name: Check the below-floor files on PHP 7.4
        run: bash "$RUNNER_TEMP/below-floor-check.sh"

      - name: Setup PHP 8.0
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.0'
          coverage: none
          tools: none

      - name: Check the below-floor files on PHP 8.0
        run: bash "$RUNNER_TEMP/below-floor-check.sh"

      - name: Setup PHP 8.1
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.1'
          coverage: none
          tools: none

      - name: Check the below-floor files on PHP 8.1
        run: bash "$RUNNER_TEMP/below-floor-check.sh"

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.2'
          coverage: none
          tools: none

      - name: Check the below-floor files on PHP 8.2
        run: bash "$RUNNER_TEMP/below-floor-check.sh"

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none
          tools: none

      - name: Check the below-floor files on PHP 8.3
        run: bash "$RUNNER_TEMP/below-floor-check.sh"

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: none

      - name: Check the below-floor files on PHP 8.4
        run: bash "$RUNNER_TEMP/below-floor-check.sh"

  build-integrity:
    name: Build integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Verify the committed deploy artifact is byte-stable
        run: |
          set -euo pipefail

          build_status=$(git status --porcelain)
          if [ -n "$build_status" ]; then
            printf '%s\n' "$build_status"
            echo "::error::the committed tree IS the deploy artifact; a byte-stable rebuild must reproduce it exactly." >&2
            exit 1
          fi

  blocks-policy:
    name: Blocks policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Blocks belong in the A8C Special Projects blocks monorepo, where every site can reuse them. A block
      # that has to live in this site repository is listed in .github/blocks-allowlist rather than marked
      # inside its block.json, which the block.json schema would reject.
      - name: Reject blocks not listed as staying in this repository
        env:
          ALLOWLIST: .github/blocks-allowlist
        run: |
          set -euo pipefail

          # One block.json path per line; `#` starts a comment. A missing file allows nothing.
          allowed=''
          if [ -f "$ALLOWLIST" ]; then
            allowed=$(sed -e 's/#.*//' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' "$ALLOWLIST")
          fi

          # Listed into a file rather than a process substitution, so a git failure fails the step.
          git ls-files -z -- 'block.json' '*/block.json' > "$RUNNER_TEMP/block-json-files"

          unlisted=0
          while IFS= read -r -d '' file; do
            if ! grep -qxF -- "$file" <<< "$allowed"; then
              echo "::error file=$file::$file keeps a block in this site repository. Blocks belong in the A8C Special Projects blocks monorepo (https://github.com/a8cteam51/special-projects-blocks-monorepo); to keep this one here, list its path in $ALLOWLIST."
              unlisted=$(( unlisted + 1 ))
            fi
          done < "$RUNNER_TEMP/block-json-files"

          if [ "$unlisted" -gt 0 ]; then
            exit 1
          fi
